# Agent query evaluation suite: five real repositories in five languages.
#
# Every question carries a manually source-reviewed judgment recorded in
# `judgment`. Anchors are exact file names, line numbers, and symbols that the
# reviewer read in the pinned checkout; they are the recall proxy used by the
# runner, not an independent precision oracle.
#
# Kinds:
#   explain    - one symbol, must locate its declaration with source evidence
#   explain_source - one symbol, must return the declaration source text
#   callers    - incoming usage, must return real call/usage sites
#   path       - symbol-to-symbol connectivity
#   file_path  - path-shaped input (file to file) connectivity
#   ambiguity  - short name with several candidates, must offer a pick list
#   negative   - absent symbol, must answer no-match instead of guessing
#   broad      - natural question whose answer needs bounded follow-up
#
# `compass` and `graphify` are the exact per-tool argument vectors. The runner
# appends tool-specific graph/bootstrap arguments.

schema = "compass.agent-query-suite/1"

