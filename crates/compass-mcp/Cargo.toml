[features]
default = []
surreal-remote = ["compass-core/surreal-remote", "compass-query/surreal-remote"]
surreal-surrealkv = [
    "compass-core/surreal-surrealkv",
    "compass-query/surreal-surrealkv",
]
surreal-rocksdb = [
    "compass-core/surreal-rocksdb",
    "compass-query/surreal-rocksdb",
]

[dependencies]
compass-agent-graph = { path = "../compass-agent-graph", version = "0.4.2" }
axum.workspace = true
rand.workspace = true
http-body-util = { workspace = true, features = ["channel"] }
rmcp.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
compass-core = { path = "../compass-core", version = "0.4.2" }
compass-files = { path = "../compass-files", version = "0.4.2" }
compass-graph = { path = "../compass-graph", version = "0.4.2" }
compass-history = { path = "../compass-history", version = "0.4.2" }
compass-model = { path = "../compass-model", version = "0.4.2" }
compass-output = { path = "../compass-output", version = "0.4.2" }
