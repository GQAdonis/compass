[package]
name = "compass-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
surreal-remote = ["dep:compass-graphdb-surreal", "compass-graphdb-surreal/remote", "dep:tokio"]
surreal-surrealkv = [
    "dep:compass-graphdb-surreal",
    "compass-graphdb-surreal/surrealkv",
    "dep:tokio",
]
surreal-rocksdb = [
    "dep:compass-graphdb-surreal",
    "compass-graphdb-surreal/rocksdb",
    "dep:tokio",
]

[dependencies]
compass-agent-graph = { path = "../compass-agent-graph", version = "0.3.28" }
compass-analysis = { path = "../compass-analysis", version = "0.3.28" }
compass-ir = { path = "../compass-ir", version = "0.3.28" }
compass-program = { path = "../compass-program", version = "0.3.28" }
ahash.workspace = true
rayon.workspace = true
notify.workspace = true
num_cpus.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
thiserror.workspace = true
compass-files = { path = "../compass-files", version = "0.3.28" }
compass-google-workspace = { path = "../compass-google-workspace", version = "0.3.28" }
compass-languages = { path = "../compass-languages", version = "0.3.28" }
compass-media = { path = "../compass-media", version = "0.3.28" }
compass-ocr = { path = "../compass-ocr", version = "0.3.28" }
compass-model = { path = "../compass-model", version = "0.3.28" }
compass-graph = { path = "../compass-graph", version = "0.3.28" }
compass-history = { path = "../compass-history", version = "0.3.28" }
compass-store = { path = "../compass-store", version = "0.3.28" }
compass-output = { path = "../compass-output", version = "0.3.28" }
compass-pr-intelligence = { path = "../compass-pr-intelligence", version = "0.3.28" }
compass-prs = { path = "../compass-prs", version = "0.3.28" }
compass-query = { path = "../compass-query", version = "0.3.28" }
compass-reflect = { path = "../compass-reflect", version = "0.3.28" }
compass-resolve = { path = "../compass-resolve", version = "0.3.28" }
compass-semantic-diff = { path = "../compass-semantic-diff", version = "0.3.28" }
compass-graphdb-surreal = { path = "../compass-graphdb-surreal", version = "0.3.28", optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
protobuf.workspace = true
