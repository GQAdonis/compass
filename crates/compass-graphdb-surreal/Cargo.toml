[package]
name = "compass-graphdb-surreal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Optional generation-atomic SurrealDB graph projection for Compass"
keywords.workspace = true
categories.workspace = true

[features]
default = []
mem = ["dep:surrealdb", "dep:tokio", "surrealdb/kv-mem"]
remote = ["dep:surrealdb", "dep:tokio", "dep:rustls", "surrealdb/protocol-ws", "surrealdb/rustls"]
surrealkv = ["dep:surrealdb", "dep:tokio", "surrealdb/kv-surrealkv"]
rocksdb = ["dep:surrealdb", "dep:tokio", "surrealdb/kv-rocksdb"]

[dependencies]
compass-files = { path = "../compass-files", version = "0.3.25" }
compass-model = { path = "../compass-model", version = "0.3.25" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
surrealdb = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[dev-dependencies]
compass-query = { path = "../compass-query", version = "0.3.25" }
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true

[package.metadata.compass.surrealdb]
version = "3.2.4"
license = "Business Source License 1.1"
change-date = "2030-01-01"
change-license = "Apache-2.0"
restriction = "Database Service"
