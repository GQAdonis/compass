[package]
name = "compass-query"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
surreal-remote = ["dep:compass-graphdb-surreal", "compass-graphdb-surreal/remote", "dep:tokio"]
surreal-surrealkv = ["dep:compass-graphdb-surreal", "compass-graphdb-surreal/surrealkv", "dep:tokio"]
surreal-rocksdb = ["dep:compass-graphdb-surreal", "compass-graphdb-surreal/rocksdb", "dep:tokio"]

[dependencies]
compass-agent-graph = { path = "../compass-agent-graph", version = "0.3.29" }
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
compass-cypher = { path = "../compass-cypher", version = "0.3.29" }
compass-model = { path = "../compass-model", version = "0.3.29" }
compass-analysis = { path = "../compass-analysis", version = "0.3.29" }
compass-ir = { path = "../compass-ir", version = "0.3.29" }
compass-store = { path = "../compass-store", version = "0.3.29" }
compass-graph = { path = "../compass-graph", version = "0.3.29" }
tokio = { workspace = true, optional = true }
compass-graphdb-surreal = { path = "../compass-graphdb-surreal", version = "0.3.29", optional = true }
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix.workspace = true

[dev-dependencies]
compass-graphdb = { path = "../compass-graphdb", version = "0.3.29" }
compass-languages = { path = "../compass-languages", version = "0.3.29" }
